<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Mahasiswa</title>
  <style>
    :root {
      --latar: #f6f8f7;
      --kartu: #ffffff;
      --teks: #1d2b27;
      --samar: #5d6d68;
      --garis: #d9e1de;
      --aksen: #1f6f5c;
      --galat: #a63d2f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --latar: #121917;
        --kartu: #1a2320;
        --teks: #e6eeeb;
        --samar: #9fb0aa;
        --garis: #2c3a36;
        --aksen: #5fc3a6;
        --galat: #f08a7b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem 1rem;
      background: var(--latar);
      color: var(--teks);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 52rem; margin: 0 auto; }
    h1 { margin: 0 0 .25rem; font-size: 1.6rem; }
    .keterangan { margin: 0 0 1.5rem; color: var(--samar); max-width: 60ch; }
    .bungkus {
      overflow-x: auto;
      background: var(--kartu);
      border: 1px solid var(--garis);
      border-radius: 8px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .75rem 1rem; text-align: left; }
    thead th {
      border-bottom: 2px solid var(--aksen);
      font-weight: 600;
      white-space: nowrap;
    }
    tbody tr + tr td { border-top: 1px solid var(--garis); }
    td.pesan { padding: 2rem 1rem; text-align: center; color: var(--samar); }
    td.galat { color: var(--galat); }
  </style>
</head>
<body>
  <main>
    <h1>Data Mahasiswa</h1>
    <p class="keterangan">Data diambil langsung dari endpoint <code>GET /mahasiswa</code> menggunakan Fetch API.</p>
    <div class="bungkus">
      <table id="tabel-mahasiswa">
        <thead>
          <tr><th>NIM</th><th>Nama</th><th>Program Studi</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
